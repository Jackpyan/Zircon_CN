<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>激活失败 · 玛法通行</title>
<style>
:root{
  --gold:#c8a45c; --gold-l:#f2dda6; --gold-d:#6b4f1d;
  --blood:#a8322a; --blood-l:#e07a6f;
  --paper:#e8dcc0; --muted:#8d7a58;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:32px 16px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 85% at 50% -10%,#2c1c0f 0%,#120c08 45%,#070504 100%);
  color:var(--paper);
  font-family:"Songti SC","STSong","STZhongsong","SimSun","Noto Serif SC",serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 1px,transparent 1px 4px);
}
.frame{
  position:relative;width:min(560px,100%);
  padding:42px 34px 30px;
  background:linear-gradient(180deg,#17110a 0%,#0d0906 55%,#0a0705 100%);
  border:1px solid var(--gold-d);
  box-shadow:
    0 0 0 1px rgba(200,164,92,.14) inset,
    0 0 0 6px rgba(0,0,0,.6),
    0 24px 64px rgba(0,0,0,.72),
    0 0 72px rgba(200,164,92,.07);
  text-align:center;
}
.frame::before,.frame::after{
  content:"";position:absolute;width:20px;height:20px;border:1px solid var(--gold);opacity:.7;
}
.frame::before{left:9px;top:9px;border-right:0;border-bottom:0}
.frame::after{right:9px;bottom:9px;border-left:0;border-top:0}
.eyebrow{
  margin:0 0 14px;font-size:12px;letter-spacing:.42em;text-indent:.42em;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d))}
.eyebrow::after{background:linear-gradient(90deg,var(--gold-d),transparent)}
h1{
  margin:0 0 8px;font-size:30px;font-weight:700;line-height:1.3;
  letter-spacing:.3em;text-indent:.3em;
  background:linear-gradient(180deg,#f8ecbf,#c8a45c 58%,#8a6a2a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.85));
}
h1.bad{background:linear-gradient(180deg,#f3c7bd,#c2493b 58%,#7d241c);-webkit-background-clip:text;background-clip:text}
.sub{margin:0 0 22px;font-size:10px;letter-spacing:.44em;text-indent:.44em;color:#6f5d3e;font-family:Georgia,serif}
.seal{
  width:76px;height:76px;margin:0 auto 22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:700;color:var(--gold-l);
  border:2px solid var(--gold);
  box-shadow:0 0 0 5px rgba(200,164,92,.08),0 0 26px rgba(200,164,92,.22) inset,0 0 26px rgba(200,164,92,.14);
  text-shadow:0 0 14px rgba(242,221,166,.55);
}
.seal.bad{
  color:var(--blood-l);border-color:var(--blood);
  box-shadow:0 0 0 5px rgba(168,50,42,.10),0 0 26px rgba(168,50,42,.26) inset,0 0 26px rgba(168,50,42,.16);
  text-shadow:0 0 14px rgba(224,122,111,.5);
}
.msg{margin:0 0 20px;font-size:15px;line-height:2;color:#cfc2a4;letter-spacing:.06em}
.tips{
  margin:0;padding:16px 0 0;list-style:none;text-align:left;
  border-top:1px dashed rgba(200,164,92,.22);font-size:13px;line-height:1.9;color:#a89877;
}
.tips li{position:relative;padding-left:16px}
.tips li::before{content:"·";position:absolute;left:4px;color:var(--gold);font-weight:700}
.tips li+li{margin-top:4px}
footer{margin-top:22px;font-size:12px;letter-spacing:.12em;color:#6a5a44}
@media (max-width:520px){
  .frame{padding:34px 20px 24px}
  h1{font-size:24px;letter-spacing:.2em;text-indent:.2em}
  .msg{font-size:14px}
}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">玛法大陆 · 通行文书</p>
  <h1 class="bad">激活失败</h1>
  <p class="sub">ACTIVATION FAILED</p>
  <div class="seal class="bad""><span>败</span></div>
  <p class="msg">此激活令牌无效、已过期，或已被使用。</p>
  <ul class="tips">
    <li>请回到游戏登录界面，重新申请激活邮件。</li>
    <li>若反复失败，请核对注册邮箱是否填写正确。</li>
  </ul>
  <footer>本页可安全关闭</footer>
</div>
</body>
</html>
